[project]
name = "kiseki-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kiseki = { workspace = true }
kiseki-ingest = { workspace = true }
kiseki-conformance = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
    "mypy",
    "import-linter",
    "pre-commit",
    "jsonschema",
    "pillow",
    "piexif",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "packages/kiseki-core/src:packages/kiseki-ingest/src:packages/kiseki-conformance/src"

[[tool.mypy.overrides]]
module = ["jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: tests that call a real language model, excluded from CI",
    "slow: tests that take a long time",
]
addopts = "-m 'not llm'"
