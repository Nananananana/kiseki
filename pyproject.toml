[project]
name = "kiseki-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
heif = [
    "pillow-heif>=1.5.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kiseki = { workspace = true }
kiseki-ingest = { workspace = true }
kiseki-notes = { workspace = true }
kiseki-web = { workspace = true }
kiseki-conformance = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff==0.16.2",
    "mypy",
    "import-linter",
    "pre-commit",
    "jsonschema",
    "pillow",
    "piexif",
    "pyyaml",
    "cosmic-ray>=8.7.0",
    "pandas>=3.0.5",
    "shapely>=2.1.2",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "ijson>=3.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "packages/kiseki-core/src:packages/kiseki-ingest/src:packages/kiseki-notes/src:packages/kiseki-web/src:packages/kiseki-conformance/src"

[[tool.mypy.overrides]]
module = ["jsonschema.*", "PIL.*", "pillow_heif.*", "sklearn.*", "ijson.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "llm: tests that call a real language model, excluded from CI",
    "slow: tests that take a long time",
]
addopts = "-m 'not llm'"
empty_parameter_set_mark = "fail_at_collect"
