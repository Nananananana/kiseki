[project]
name = "kiseki-workspace"
version = "0.0.0"
requires-python = ">=3.12"

[project.optional-dependencies]
heif = [
    "pillow-heif>=1.5.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kiseki = { workspace = true }
kiseki-ingest = { workspace = true }
kiseki-notes = { workspace = true }
kiseki-web = { workspace = true }
kiseki-conformance = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff==0.16.2",
    "mypy",
    "import-linter",
    "pre-commit",
    "jsonschema",
    "pillow",
    "piexif",
    "pyyaml",
    "cosmic-ray>=8.7.0",
    "pandas>=3.0.5",
    "shapely>=2.1.2",
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "ijson>=3.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "ISC", "BLE", "DTZ"]
# ARG, ISC, BLE and DTZ were added after one week found, by hand, an
# ignored `blur` parameter serving raw coordinates (#398), a Chromium day
# computed in UTC (#399), and a kept profile stamped without its offset
# (#402). Each is the class of defect one of these rules exists for.

[tool.ruff.lint.per-file-ignores]
# The command line compares a naive `now()` against stored moments it has
# already stripped to naive (ADR-0064): ages in days, for a reader. Making
# it aware is the other half of #402, not a lint fix.
"packages/kiseki-core/src/kiseki/interfaces/cli.py" = ["DTZ005", "DTZ011"]
# Tests stub protocols with fakes that ignore arguments, build fixtures
# with naive datetimes on purpose, and catch broadly to assert on the
# message. The rules exist for shipped source, which is where every
# defect they were added for lived.
"tests/**/*.py" = ["ARG", "DTZ", "BLE"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "packages/kiseki-core/src:packages/kiseki-ingest/src:packages/kiseki-notes/src:packages/kiseki-web/src:packages/kiseki-conformance/src"

[[tool.mypy.overrides]]
module = ["jsonschema.*", "PIL.*", "pillow_heif.*", "sklearn.*", "ijson.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
    "llm: tests that call a real language model, excluded from CI",
    "slow: tests that take a long time",
]
addopts = "-m 'not llm'"
empty_parameter_set_mark = "fail_at_collect"
