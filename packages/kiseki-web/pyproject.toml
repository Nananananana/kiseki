[project]
name = "kiseki-web"
version = "0.1.0"
description = "Reference implementation that turns a browser history into WebRecord documents"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
kiseki-web = "kiseki_web.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiseki_web"]
