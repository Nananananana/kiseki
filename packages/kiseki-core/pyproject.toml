[project]
name = "kiseki"
version = "0.10.0"
description = "Reconstruct journeys from photo timelines and infer preferences"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
kiseki = "kiseki.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiseki"]
