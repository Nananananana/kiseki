[project]
name = "kiseki"
version = "0.11.0"
description = "Reconstruct journeys from photo timelines and infer preferences"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

# Optional, and optional on purpose. The claim this package makes is
# that it needs nothing to run; a wheel check enforces that against
# `Requires-Dist`, which is why these are extras and not dependencies.
# Everything under `kiseki.domain` works without any of them -- the
# extras buy speed and two algorithms the standard library cannot
# reach, in the adapters layer, where a dependency belongs.
[project.optional-dependencies]
clustering = ["scikit-learn>=1.3", "numpy>=1.24"]

[project.scripts]
kiseki = "kiseki.interfaces.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiseki"]
