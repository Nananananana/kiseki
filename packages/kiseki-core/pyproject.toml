[project]
name = "kiseki"
version = "0.1.0"
description = "写真の時系列から行程と趣向を抽出するライブラリ"
readme = "../../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
geocoding = ["httpx>=0.27"]

[project.scripts]
kiseki = "kiseki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiseki"]
