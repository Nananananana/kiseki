[project]
name = "kiseki-ingest"
version = "0.1.0"
description = "Reference implementation that turns EXIF metadata into PhotoRecord"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pillow>=10"]

[project.optional-dependencies]
heif = ["pillow-heif>=0.16"]

[project.scripts]
kiseki-ingest = "kiseki_ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiseki_ingest"]
