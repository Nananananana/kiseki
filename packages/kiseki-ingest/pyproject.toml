[project]
name = "kiseki-ingest"
version = "0.1.0"
description = "EXIF から PhotoRecord を生成する参考実装"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pillow>=10", "pillow-heif>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiseki_ingest"]
