[project]
name = "kiseki-notes"
version = "0.1.0"
description = "Reference implementation that turns a folder of notes into NoteRecord documents"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.scripts]
kiseki-notes = "kiseki_notes.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiseki_notes"]
