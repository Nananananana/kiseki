[project]
name = "kiseki-conformance"
version = "0.1.0"
description = "Conformance test kit for PhotoRecord producers"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["jsonschema>=4", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiseki_conformance"]
